name: Jails
version: '1.3.1'
main: org.proto68.jails.Jails
api-version: '26.1.2'
prefix: UPBG Jails
authors: [ Proto68 ]
description: Plugin for managing jails
softdepend:
  - PlaceholderAPI
  - WorldEdit
  - WorldGuard
  - DecentHolograms
commands:
  upjail:
    description: Main admin command for the plugin
    usage: /upjail <subcommand>

  jail:
    description: Command for jailing players
    usage: /jail <username> <time> [reason] [-s]

  unjail:
    description: Command to unjail a player
    usage: /unjail <username> [reason] [-s]

permissions:
  jails.jail:
    description: Allows the sender to jail a player
    default: op

  jails.unjail:
    description: Allows the sender to unjail a player
    default: op

  jails.info:
    description: Allows the player to check jail info for another player
    default: op

  jails.admin:
    description: Grants all permissions to set spawn, cell and region and test the database
    default: op